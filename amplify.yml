version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify 콘솔의 환경변수는 SSR 런타임에 그대로 전달되지 않는다.
        # Next.js 가 읽는 .env.production 으로 옮겨야 서버 컴포넌트/라우트에서 보인다.
        # grep 이 하나도 못 찾으면 exit 1 이라 빌드가 깨지므로 || true 로 막아둔다.
        - env | grep -e '^SUPABASE_URL=' -e '^SUPABASE_SERVICE_ROLE_KEY=' -e '^ADMIN_PASSWORD=' >> .env.production || true
        - npm run build
  artifacts:
    # SSR 앱은 out/ 이 아니라 .next 를 배포한다
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
